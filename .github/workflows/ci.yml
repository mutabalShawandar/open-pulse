name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27.4
        ports:
          - 1025:1025
          - 8025:8025
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      MAILPIT_API_URL: http://localhost:8025
      KEYCLOAK_URL: http://localhost:8081
      KEYCLOAK_INTERNAL_URL: http://localhost:8081
      KEYCLOAK_REALM: openpulse
      KEYCLOAK_CLIENT_ID: openpulse-frontend
      KEYCLOAK_AUDIENCE: openpulse-api
      KEYCLOAK_ISSUER: http://localhost:8081/realms/openpulse
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Pinned to the commit documented by uv for GitHub Actions (v9.0.0).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Apply database migrations
        run: uv run --no-sync alembic upgrade head

      - name: Run unit and integration tests
        run: uv run --no-sync pytest tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_ROOT_DOMAIN: localhost
      APP_URL: http://localhost:3000
      KEYCLOAK_ISSUER: http://localhost:8081/realms/openpulse
      KEYCLOAK_FRONTEND_CLIENT_ID: openpulse-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate docker-compose.yml with the example env
        run: |
          cp .env.example .env
          docker compose config --quiet

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create local env file
        run: cp .env.example .env

      - name: Start the stack, seed demo data and send a campaign
        run: ./.github/scripts/compose-smoke.sh

      - name: Stop the stack
        if: always()
        run: docker compose --profile demo down -v

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
