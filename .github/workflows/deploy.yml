name: Test and deploy

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options: [staging, production]
      ref:
        description: Use staging for staging or main for production
        required: true
        default: main
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  test:
    name: Backend and frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Pinned to the commit documented by uv for GitHub Actions (v9.0.0).
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Run backend unit tests
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          KEYCLOAK_URL: http://localhost:8081
          KEYCLOAK_INTERNAL_URL: http://localhost:8081
          KEYCLOAK_REALM: openpulse
          KEYCLOAK_CLIENT_ID: openpulse-frontend
          KEYCLOAK_AUDIENCE: openpulse-api
          KEYCLOAK_ISSUER: http://localhost:8081/realms/openpulse
        run: |
          uv sync --frozen --all-groups
          uv run pytest tests --ignore=tests/integration

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_ROOT_DOMAIN: localhost
          APP_URL: http://localhost:3000
          KEYCLOAK_ISSUER: http://localhost:8081/realms/openpulse
          KEYCLOAK_FRONTEND_CLIENT_ID: openpulse-frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    name: Deploy
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_name == 'staging')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
    concurrency:
      group: deploy-${{ github.event_name == 'push' && 'staging' || inputs.target }}
      cancel-in-progress: false
    env:
      DEPLOY_TARGET: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
      DEPLOY_REF: ${{ github.event_name == 'push' && github.sha || inputs.ref }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      DEPLOY_ENV_FILE_B64: ${{ secrets.DEPLOY_ENV_FILE_B64 }}
    steps:
      - name: Validate deployment selection
        run: |
          if [ "$DEPLOY_TARGET" = production ] && [ "$DEPLOY_REF" != main ]; then
            echo "Production deployments must use main."
            exit 1
          fi
          if [ "$DEPLOY_TARGET" = staging ] && [ "$DEPLOY_REF" != staging ] && [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "Staging deployments must use staging."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.ref }}

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH host verification
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy source and environment file to VPS
        run: |
          printf '%s' "$DEPLOY_ENV_FILE_B64" | base64 --decode > "$RUNNER_TEMP/.env.$DEPLOY_TARGET"
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_DEPLOY_PATH'"
          rsync -az --delete \
            --exclude '.git/' --exclude '.env' --exclude '.env.*' \
            --exclude '**/.venv/' --exclude 'frontend/node_modules/' --exclude 'frontend/.next/' \
            ./ "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"
          scp "$RUNNER_TEMP/.env.$DEPLOY_TARGET" "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/.env.$DEPLOY_TARGET"
          rm -f "$RUNNER_TEMP/.env.$DEPLOY_TARGET"

      - name: Migrate and deploy on VPS
        run: |
          ssh "$VPS_USER@$VPS_HOST" "
            set -eu
            cd '$VPS_DEPLOY_PATH'
            docker compose --project-name openpulse-$DEPLOY_TARGET --env-file .env.$DEPLOY_TARGET -f docker-compose.prod.yml up -d --build postgres redis storage keycloak
            docker compose --project-name openpulse-$DEPLOY_TARGET --env-file .env.$DEPLOY_TARGET -f docker-compose.prod.yml --profile migration run --rm migrate
            docker compose --project-name openpulse-$DEPLOY_TARGET --env-file .env.$DEPLOY_TARGET -f docker-compose.prod.yml up -d --build backend worker frontend
            docker compose --project-name openpulse-$DEPLOY_TARGET --env-file .env.$DEPLOY_TARGET -f docker-compose.prod.yml ps
          "
