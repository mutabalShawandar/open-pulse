[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cryptography>=46.0.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "reportlab>=4.4.10",
    "redis>=7.2.1",
    "sqlalchemy>=2.0.52",
    "xlsxwriter>=3.2.9",
    "boto3>=1.43.99",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # line length is handled by `ruff format`
    "UP042",  # (str, Enum) is kept: StrEnum changes str() behaviour
    "SIM102", # nested ifs are often clearer
    "SIM117", # nested `with` blocks are often clearer in tests
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "app.api.deps.require_permission",
   "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body", "fastapi.File", "fastapi.Form"]
