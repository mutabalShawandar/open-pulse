services:
  postgres:
    image: postgres:16-alpine
    container_name: openpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: openpulse-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:latest
    container_name: openpulse-storage
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9333:9333"
    volumes:
      - minio_data:/data

  migrate:
    build:
      context: ./backend
    container_name: openpulse-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://storage:8333
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: openpulse-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://storage:8333
      # The local reverse proxy is the only trusted source of forwarded client IPs.
      FORWARDED_ALLOW_IPS: 172.17.0.1
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    container_name: openpulse-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://storage:8333
    command: ["python", "-m", "app.workers.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  bootstrap-admin:
    build:
      context: ./backend
    container_name: openpulse-bootstrap-admin
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://storage:8333
    # Keycloak's realm import finishes some time after the container reports
    # "started", so retry until the admin API and the seeded user are ready.
    command:
      - sh
      - -c
      - |
        for attempt in $$(seq 1 30); do
          python scripts/bootstrap_platform_admin.py --email "$${SEED_ADMIN_EMAIL:-admin@openpulse.local}" && exit 0
          echo "Waiting for Keycloak to accept admin API requests (attempt $$attempt/30)..."
          sleep 3
        done
        echo "Failed to bootstrap the local platform administrator after 30 attempts."
        exit 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: openpulse-keycloak
    command: start-dev --import-realm
    environment:
      # Browser-facing base URL. Internal services use KEYCLOAK_INTERNAL_URL instead.
      KC_HOSTNAME: ${KEYCLOAK_URL}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_SCHEMA: ${KEYCLOAK_SCHEMA}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak/local-realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-}
        APP_URL: ${APP_URL}
        KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
        KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID}
    container_name: openpulse-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-}
      APP_URL: ${APP_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_INTERNAL_ISSUER: ${KEYCLOAK_INTERNAL_ISSUER:-}
      KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: openpulse-mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - mailpit_data:/data
      
volumes:
  postgres_data:
  mailpit_data:
  minio_data:

